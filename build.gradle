plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

group = mod_group_id
version = mod_version

def referenceRoot = file('../../../reference-build-safe')
def referenceOutput = new File(referenceRoot, 'v0.3.0-converged')
layout.buildDirectory = new File(referenceOutput, 'build-output')
def dependencyInput = new File(referenceRoot, 'v0.3.0-astra')
// Repackaged's required library already embeds Compat Manager.
if (project.hasProperty('withRepackaged') && !project.hasProperty('withDeployer')) project.ext.set('withDeployer', true)

def runProfile = "neo${project.neo_version}" + (project.hasProperty('withCouriers') ? '-paper' : '') +
        (project.hasProperty('withMobile') ? '-mobile' : '') +
        (project.hasProperty('withPhantom') ? '-phantom102' : '') +
        (project.hasProperty('withJei') ? "-jei${project.findProperty('jei_runtime_version') ?: jei_version}" : '') + '-converged1'
['withTacz','withWand','withGadgets','withEffortless','withEmi','withFxnt','withSophisticated','withMaid','withFluid','withFactory','withDeployer','withRepackaged','withConnected','withCraftingTweaks','withGravestone','withCorpse','withTombstone','withTomsStorage','withPolymorph','withMouseTweaks','withModernFix','withLithium'].each { flag -> if (project.hasProperty(flag)) runProfile += '-' + flag.substring(4).toLowerCase() }
if (project.hasProperty('mobile_runtime_version')) {
    if (!project.hasProperty('withMobile') || project.property('mobile_runtime_version').toString() != '0.7.8')
        throw new GradleException('The explicit Mobile Packages runtime input is pinned to 0.7.8 and requires withMobile')
    runProfile += '-mobile078'
}
if (project.hasProperty('fmpPhantomReview')) {
    if (!project.hasProperty('withPhantom')) throw new GradleException('Phantom review requires the locked official transport JAR')
    runProfile += '-phantom-review'
}
if (project.hasProperty('fmpPhantomPublished')) {
    if (!project.hasProperty('fmpPhantomReview') || project.hasProperty('fmpPackaged')) throw new GradleException('Published transport probe requires its isolated review profile')
    runProfile += '-released023'
}
if (project.hasProperty('fmpFoldReview')) {
    if (!(project.property('fmpFoldReview') in ['collapse', 'expand', 'verify']) ||
            !project.hasProperty('fmpGameTests') || project.hasProperty('fmpPackaged'))
        throw new GradleException('Fold review requires development tests and collapse/expand/verify')
    runProfile += '-fold-review'
}
if (project.hasProperty('fmpLegacyWorldReview')) runProfile += '-legacy023'
if (project.hasProperty('withInstanceJei') && (!project.hasProperty('withJei') || project.findProperty('jei_runtime_version') != '19.56.0.441'))
    throw new GradleException('Pinned newer JEI requires withJei and jei_runtime_version=19.56.0.441')
if (project.hasProperty('fmpArtifactProbe') && !project.hasProperty('fmpPackaged'))
    throw new GradleException('Artifact probe must use the actual packaged JAR')
if (project.hasProperty('fmpPackaged')) {
    if (project.hasProperty('fmpGameTests') || project.hasProperty('fmpClientReview')) throw new GradleException('Packaged verification cannot load development test sources')
    runProfile += '-packaged' + (project.hasProperty('fmpArtifactProbe') ? '-probe' : '')
}
if (project.hasProperty('fmpProbeMissing')) {
    def missing = project.property('fmpProbeMissing')
    if (!(missing in ['create', 'curios'])) throw new GradleException('Unknown required dependency probe')
    runProfile += "-missing-${missing}"
}

// Windows cannot start a child process with a long working directory. Preserve the complete profile in the log.
if (runProfile.length() > 88) {
    def descriptiveProfile = runProfile
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(runProfile.getBytes('UTF-8')).encodeHex().toString().substring(0,16)
    runProfile = 'neo' + project.neo_version + '-set-' + digest
    logger.lifecycle('FMP run profile {} = {}', runProfile, descriptiveProfile)
}

base {
    archivesName = 'create-feed-me-packages'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    test { java.srcDir('src/testFixtures/java') }
    gameTest {
        java.setSrcDirs(['src/gametest/java', 'src/testFixtures/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven { url = new File(dependencyInput, 'dependencies/maven'); content { includeGroup 'dev.emi' } }
    maven { url = 'https://repo.sleeping.town/'; content { includeGroup 'dev.emi' } }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") {
        transitive = false
    }

    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"

    localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    localRuntime "dev.engine-room.vanillin:vanillin-neoforge-1.21.1:${vanillin_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    if (project.hasProperty('fmpPackaged')) {
        def artifact = layout.buildDirectory.file("libs/create-feed-me-packages-${project.version}.jar").get().asFile
        if (!artifact.isFile()) throw new GradleException('Build the main JAR before packaged verification')
        localRuntime files(artifact)
        if (project.hasProperty('fmpArtifactProbe')) localRuntime files(new File(referenceOutput, 'fmp-artifact-probe.jar'))
    }

    [withDeployer: 'deployer/0.1.3/deployer-0.1.3.jar',
     withFactory: 'create_factory_logistics/1.6.0/create_factory_logistics-1.21.1-1.6.0-all.jar',
     withRepackaged: 'repackaged/0.0.7/repackaged-0.0.7.jar',
     withConnected: 'create-connected/1.3.3/create_connected-1.3.3-mc1.21.1.jar',
     withCraftingTweaks: 'craftingtweaks/21.1.11/craftingtweaks-neoforge-1.21.1-21.1.11.jar',
     withGravestone: 'gravestone/1.0.40/gravestone-neoforge-1.21.1-1.0.40.jar',
     withCorpse: 'corpse/1.1.13/corpse-neoforge-1.21.1-1.1.13.jar',
     withTombstone: 'tombstone/9.5.6/tombstone-neoforge-1.21.1-9.5.6.jar',
     withTomsStorage: 'toms-storage/2.4.2/toms_storage-1.21-2.4.2.jar',
     withPolymorph: 'polymorph/1.2.0+1.21.1/polymorph-neoforge-1.2.0+1.21.1.jar',
     withMouseTweaks: 'mousetweaks/2.26.1/MouseTweaks-neoforge-mc1.21-2.26.1.jar',
     withModernFix: 'modernfix/5.27.24/modernfix-neoforge-5.27.24+mc1.21.1.jar',
     withLithium: 'lithium/0.15.4/lithium-neoforge-0.15.4+mc1.21.1.jar'].each { flag, relative ->
        if (project.hasProperty(flag)) {
            def artifact = new File(dependencyInput, "dependencies/artifacts/${relative}")
            if (!artifact.isFile()) throw new GradleException("Missing pinned isolated optional test artifact: ${relative}")
            localRuntime files(artifact)
        }
    }

    if (project.hasProperty('withCraftingTweaks')) {
        def balm = new File(dependencyInput, 'dependencies/artifacts/balm/21.0.65/balm-neoforge-1.21.1-21.0.65.jar')
        if (!balm.isFile()) throw new GradleException('Missing pinned isolated Balm dependency')
        localRuntime files(balm)
    }

    if (project.hasProperty('withTacz')) {
        def tacz = new File(dependencyInput, 'dependencies/artifacts/tacz/1.1.8-hotfix-r6/tacz-neoforge-1.21.1-1.1.8-hotfix-r6.jar')
        if (!tacz.isFile()) throw new GradleException('Missing pinned, isolated TaCZ 1.1.8-hotfix-r6 test artifact')
        localRuntime files(tacz)
    }
    if (project.hasProperty('withWand')) {
        def wand = new File(dependencyInput, 'dependencies/artifacts/constructionwand/2.16.12/constructionwand-kots-1.21.1-2.16.12.jar')
        if (!wand.isFile()) throw new GradleException('Missing pinned, isolated Construction Wand KOTS 2.16.12 test artifact')
        localRuntime files(wand)
    }
    if (project.hasProperty('withGadgets')) {
        def gadgets = new File(dependencyInput, 'dependencies/artifacts/buildinggadgets2/1.3.9/buildinggadgets2-1.3.9.jar')
        if (!gadgets.isFile()) throw new GradleException('Missing pinned, isolated Building Gadgets 2 1.3.9 test artifact')
        localRuntime files(gadgets)
    }
    if (project.hasProperty('withEffortless')) {
        def effortless = new File(dependencyInput, "dependencies/artifacts/effortlessbuilding/4.2/effortlessbuilding-4.2+1.21.1.jar")
        if (!effortless.isFile()) throw new GradleException('Missing pinned, isolated Effortless Building test artifact')
        localRuntime files(effortless)
    }
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    if (project.hasProperty('withEmi')) localRuntime 'dev.emi:emi-neoforge:1.1.24+1.21.1'
    if (project.hasProperty('withFxnt')) localRuntime files(new File(dependencyInput, 'dependencies/artifacts/fxntstorage/1.3.4/fxntstorage-1.3.4+mc-1.21.1-neoforge.jar'))
    if (project.hasProperty('withFluid')) {
        def fluid = new File(dependencyInput, 'dependencies/artifacts/fluidlogistics/1.2.9/fluidlogistics-1.2.9.jar')
        if (!fluid.isFile()) throw new GradleException('Missing pinned, isolated FluidLogistics 1.2.9 test artifact')
        localRuntime files(fluid)
    }
    if (project.hasProperty('withMaid')) {
        def maid = new File(dependencyInput, 'dependencies/artifacts/touhoulittlemaid/1.5.3/touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar')
        if (!maid.isFile()) throw new GradleException('Missing pinned isolated Touhou Little Maid artifact')
        localRuntime files(maid)
    }
    if (project.hasProperty('withSophisticated')) {
        ['sophisticatedbackpacks/3.26.3.2158/sophisticatedbackpacks-1.21.1-3.26.3.2158.jar',
         'sophisticatedcore/1.5.1.2341/sophisticatedcore-1.21.1-1.5.1.2341.jar'].each { path ->
            def artifact = new File(dependencyInput, 'dependencies/artifacts/' + path)
            if (!artifact.isFile()) throw new GradleException('Missing pinned isolated backpack artifact: ' + path)
            localRuntime files(artifact)
        }
    }
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    if (project.hasProperty('withJei')) {
        if (project.hasProperty('withInstanceJei')) {
            def jei = new File(dependencyInput, 'dependencies/artifacts/jei/19.56.0.441/jei-1.21.1-neoforge-19.56.0.441.jar')
            if (!jei.isFile()) throw new GradleException('Missing pinned JEI 19.56.0.441 test input')
            localRuntime files(jei)
        } else localRuntime "mezz.jei:jei-1.21.1-neoforge:${project.findProperty('jei_runtime_version') ?: jei_version}"
    }
    if (project.hasProperty('withMobile')) {
        def mobile = project.hasProperty('mobile_runtime_version')
                ? new File(referenceOutput, 'transport-compat/create_mobile_packages-1.21.1-0.7.8.jar')
                : file('../../../reference-build-safe/research/transports/1.21.1-0.7.7/create_mobile_packages-1.21.1-0.7.7.jar')
        if (!mobile.isFile()) throw new GradleException('Missing pinned isolated Mobile Packages input')
        localRuntime files(mobile)
    }
    if (project.hasProperty('withCouriers')) {
        localRuntime files('../../../reference-build-safe/research/transports/2.3.0/cmpackagecouriers-neoforge-2.3.0.jar')
    }
    if (project.hasProperty('withPhantom')) {
        def phantom = new File(referenceOutput, 'phantom-compat/createphantom-1.0.2.jar')
        if (!phantom.isFile()) throw new GradleException('Missing locked Create Phantom 1.0.2 research input')
        localRuntime files(phantom)
    }
    if (project.hasProperty('fmpPhantomPublished')) {
        localRuntime files('../../../release/stable/v0.2.3/create-feed-me-packages-0.2.3.jar')
        localRuntime files(new File(referenceOutput, 'phantom-compat/fmp-phantom-test-probe.jar'))
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('fmpPhantomReview') ? 'fmp_phantom_compat' : (project.hasProperty('fmpLegacyWorldReview') ? 'fmp_legacy_migration' : project.mod_id + (project.hasProperty('withPhantom') ? ',fmp_phantom_compat' : ''))
            logLevel = org.slf4j.event.Level.INFO
            jvmArgument '-Xmx2G'
        }

        client {
            client()
            gameDirectory = file("${referenceOutput}/run/client/${runProfile}")
            if (project.hasProperty('fmpClientReview')) systemProperty 'fmp.clientReview', 'true'
            if (project.hasProperty('fmpCompatReview')) {
                if (!project.hasProperty('fmpGameTests') && !project.hasProperty('fmpArtifactProbe')) throw new GradleException('Compatibility review requires isolated test sources or external artifact probe')
                def review = project.property('fmpCompatReview').toString()
                if (!(review in ['templates','jei','emi','fluid','fluid-input','capacity','fxnt','sophisticated','maid','pallet','feedback','tacz','wand','gadgets','effortless','craftingtweaks','mousetweaks','toms','toms-network','toms-polymorph','polymorph']))
                    throw new GradleException('Unknown compatibility review')
                systemProperty 'fmp.compatReview', review
            }
            if (project.hasProperty('fmpConvergedReview')) systemProperty 'fmp.convergedReview', 'true'
            if (project.hasProperty('fmpT14Review')) systemProperty 'fmp.t14Review', 'true'
            if (project.hasProperty('fmpFoldReview')) systemProperty 'fmp.foldReview', project.property('fmpFoldReview')
        }

        server {
            server()
            gameDirectory = file("${referenceOutput}/run/server/${runProfile}")
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file("${referenceOutput}/run/gametest/${runProfile}")
            systemProperty 'fmp.requirePriorPersistence', project.findProperty('fmpRequirePriorPersistence') ?: 'false'
            if (project.hasProperty('fmpFluidLifecycle')) {
                def scenario = project.property('fmpFluidLifecycle').toString()
                if (!project.hasProperty('fmpGameTests') || !(scenario ==~ /(plain|residual):(write|absent|absent-again|restore)/))
                    throw new GradleException('Fluid lifecycle requires test sources and plain|residual:write|absent|absent-again|restore')
                gameDirectory = new File(referenceOutput, "run/gametest/fluid-lifecycle-${scenario.split(':')[0]}-converged1")
                systemProperty 'neoforge.enabledGameTestNamespaces', 'fmp_lifecycle'
                systemProperty 'fmp.fluidLifecycle', scenario
            }
            if (project.hasProperty('fmpConfigStartup')) {
                def scenario = project.property('fmpConfigStartup').toString()
                if (!project.hasProperty('fmpGameTests') || !(scenario ==~ /(missing|broken|illegal|custom):[a-z0-9_-]+/))
                    throw new GradleException('Config startup requires isolated tests and <missing|broken|illegal|custom>:<batch>')
                def parts = scenario.split(':')
                gameDirectory = new File(referenceOutput, "run/gametest/config-startup-${parts[0]}-${parts[1]}")
                systemProperty 'neoforge.enabledGameTestNamespaces', 'fmp_config_startup'
                systemProperty 'fmp.configStartup', parts[0]
            }
            if (project.hasProperty('fmpCapacityLifecycle')) {
                def scenario = project.property('fmpCapacityLifecycle').toString()
                if (!project.hasProperty('fmpGameTests') || !(scenario ==~ /(write|shrink|restore|verify):[a-z0-9_-]+/))
                    throw new GradleException('Capacity lifecycle requires test sources and <write|shrink|restore|verify>:<batch>')
                def parts = scenario.split(':')
                gameDirectory = new File(referenceOutput, "run/gametest/capacity-lifecycle-${parts[1]}")
                systemProperty 'neoforge.enabledGameTestNamespaces', 'fmp_capacity'
                systemProperty 'fmp.capacityLifecycle', parts[0]
            }
            if (project.hasProperty('fmpMaidFlight')) {
                def scenario = project.property('fmpMaidFlight').toString()
                if (!project.hasProperty('fmpGameTests') || !project.hasProperty('withMaid') ||
                        !(scenario ==~ /(paper|bee):(write|read|verify):[a-z0-9_-]+/))
                    throw new GradleException('Maid flight requires test sources, withMaid and <paper|bee>:<write|read|verify>:<batch>')
                def parts = scenario.split(':')
                if (!project.hasProperty(parts[0] == 'paper' ? 'withCouriers' : 'withMobile'))
                    throw new GradleException('Maid flight requires its actual native carrier')
                gameDirectory = new File(referenceOutput, "run/gametest/maid-flight-${parts[0]}-${parts[2]}")
                systemProperty 'neoforge.enabledGameTestNamespaces', 'fmp_maid_lifecycle'
                systemProperty 'fmp.maidFlight', scenario
            }
            if (project.hasProperty('fmpLegacyWorldReview')) {
                systemProperty 'fmp.legacyBackup', new File(referenceOutput, 'legacy023-before').absolutePath
                systemProperty 'fmp.legacyJar', file('../../../release/stable/v0.2.3/create-feed-me-packages-0.2.3.jar').absolutePath
            }
        }
    }

    if (!project.hasProperty('fmpPackaged') && !project.hasProperty('fmpPhantomPublished')) {
        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
                if (project.hasProperty('fmpGameTests')) sourceSet sourceSets.gameTest
            }
        }
    }
}

// A test-only mod loads alongside the untouched release JAR. No FMP production classes are copied.
def phantomProbeMetadata = tasks.register('phantomProbeMetadata') {
    def metadata = layout.buildDirectory.file('generated/phantom-probe/META-INF/neoforge.mods.toml')
    outputs.file(metadata)
    doLast {
        def target = metadata.get().asFile
        target.parentFile.mkdirs()
        target.text = '''modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
[[mods]]
modId="fmp_phantom_probe"
version="1"
displayName="FMP isolated Phantom compatibility probe"
'''
    }
}
tasks.register('phantomProbeJar', Jar) {
    dependsOn tasks.named('gameTestClasses'), phantomProbeMetadata
    archiveFileName = 'fmp-phantom-test-probe.jar'
    destinationDirectory = new File(referenceOutput, 'phantom-compat')
    from(sourceSets.gameTest.output) {
        include 'dev/scathiard/feedmepackages/gametest/PhantomCompatibilityTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/ReceiveTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/SupplyTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/TestPlayers*.class'
        include 'data/fmp_phantom_compat/structure/empty.nbt'
    }
    from(layout.buildDirectory.dir('generated/phantom-probe'))
}
if (project.hasProperty('fmpPhantomPublished')) {
    tasks.named('runGameTestServer').configure { dependsOn tasks.named('phantomProbeJar') }
}

// External test driver only. The production JAR is loaded unchanged, with no production output dirs.
def artifactProbeMetadata = tasks.register('artifactProbeMetadata') {
    def metadata = layout.buildDirectory.file('generated/artifact-probe/META-INF/neoforge.mods.toml')
    outputs.file(metadata)
    doLast {
        def target = metadata.get().asFile
        target.parentFile.mkdirs()
        target.text = '''modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
[[mods]]
modId="fmp_isolated_probe"
version="1"
displayName="FMP isolated artifact test driver"
[[dependencies.fmp_isolated_probe]]
modId="create_feed_me_packages"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
'''
    }
}
tasks.register('artifactProbeJar', Jar) {
    dependsOn tasks.named('gameTestClasses'), artifactProbeMetadata
    archiveFileName = 'fmp-artifact-probe.jar'
    destinationDirectory = referenceOutput
    from(sourceSets.gameTest.output) {
        // Never create split packages with production domain/service classes from legacy test fixtures.
        // Only native client drivers and their item/container fixtures belong here. Including all
        // GameTest holders makes NeoForge eagerly load historical migration-only dependencies.
        include 'dev/scathiard/feedmepackages/gametest/*ClientReview*.class'
        include 'dev/scathiard/feedmepackages/gametest/ArtifactProbeBootstrap*.class'
        include 'dev/scathiard/feedmepackages/gametest/ConsumptionTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/GadgetsTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/InteractionTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/TestPlayers*.class'
        include 'dev/scathiard/feedmepackages/gametest/ReceiveTests$Fixture.class'
        include 'data/**'
    }
    from(layout.buildDirectory.dir('generated/artifact-probe'))
    doFirst {
        def mainJar = layout.buildDirectory.file("libs/create-feed-me-packages-${project.version}.jar").get().asFile
        if (!mainJar.isFile()) throw new GradleException('Build and fix the production artifact before its probe')
        def production = new java.util.zip.ZipFile(mainJar)
        try {
            def classes = production.entries().findAll { it.name.endsWith('.class') }.collect { it.name }.toSet()
            sourceSets.gameTest.output.classesDirs.files.each { root ->
                if (root.isDirectory()) fileTree(root).matching { include '**/*.class' }.files.each { file ->
                    def relative = root.toPath().relativize(file.toPath()).toString().replace('\\','/')
                    if (classes.contains(relative)) throw new GradleException("Probe would shadow production class ${relative}")
                }
            }
        } finally { production.close() }
    }
}
if (project.hasProperty('fmpArtifactProbe')) {
    tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach { dependsOn tasks.named('artifactProbeJar') }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processGameTestResources', ProcessResources).configure {
    from('src/gametest/resources/data/create_feed_me_packages/structure/empty.nbt') { into 'data/fmp_maid_lifecycle/structure' }
    from('src/gametest/resources/data/create_feed_me_packages/structure/empty.nbt') { into 'data/fmp_config_startup/structure' }
    from('src/gametest/resources/data/create_feed_me_packages/structure/empty.nbt') {
        into 'data/fmp_phantom_compat/structure'
    }
    from('src/gametest/resources/data/create_feed_me_packages/structure/empty.nbt') {
        into 'data/fmp_capacity/structure'
    }
}

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

if (project.hasProperty('fmpPackaged') || project.hasProperty('fmpPhantomPublished')) {
    tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
        def sourceOutputs = sourceSets.main.output.files + sourceSets.gameTest.output.files
        // Snapshot the input providers before replacing the collection, avoiding a self-referential filter.
        def originalRuntime = project.files(new ArrayList<>(classpathProvider.from))
        classpathProvider.setFrom(originalRuntime.filter { !sourceOutputs.contains(it) })
        setClasspath(project.files(classpath.files.findAll { !sourceOutputs.contains(it) }))
        doFirst {
            def paths = classpathProvider.files + classpath.files
            def expectedVersion = project.hasProperty('fmpPhantomPublished') ? '0.2.3' : project.version
            def artifacts = paths.findAll { it.name == "create-feed-me-packages-${expectedVersion}.jar" }
            if (paths.any { sourceOutputs.contains(it) } || artifacts.size() != 1) throw new GradleException('Packaged run contains development outputs or lacks its single main JAR')
            println "FMP_PACKAGED_SOURCE jar=${artifacts.first()} developmentOutputs=0"
        }
    }
}

// Negative loader smoke only: remove the required runtime artifact, not its compile API.
if (project.hasProperty('fmpProbeMissing')) {
    def missing = project.property('fmpProbeMissing').toString()
    tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
        def removed = { File f -> missing == 'create' ? f.name.startsWith('create-1.21.1-') : f.name.startsWith('curios-neoforge-') }
        def originalRuntime = project.files(new ArrayList<>(classpathProvider.from))
        classpathProvider.setFrom(originalRuntime.filter { !removed(it) })
        setClasspath(project.files(classpath.files.findAll { !removed(it) }))
        doFirst { if ((classpathProvider.files + classpath.files).any { removed(it) }) throw new GradleException('Missing-dependency probe failed to remove its runtime JAR') }
    }
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '8.12'
    distributionType = Wrapper.DistributionType.BIN
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property('mod_version', project.mod_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.mod_version)
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "create-feed-me-packages-${project.version}.jar"
    manifest.attributes([
            'Specification-Title'   : mod_name,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': mod_version
    ])
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
