plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

group = mod_group_id
version = mod_version

def referenceRoot = file('../../../reference-build-safe')
def referenceOutput = new File(referenceRoot, 'v0.3.0-converged')
layout.buildDirectory = new File(referenceOutput, 'build-output')
def runProfile = "neo${project.neo_version}" + (project.hasProperty('withCouriers') ? '-paper' : '') +
        (project.hasProperty('withMobile') ? '-mobile' : '') +
        (project.hasProperty('withPhantom') ? '-phantom102' : '') +
        (project.hasProperty('withJei') ? "-jei${project.findProperty('jei_runtime_version') ?: jei_version}" : '') + '-converged1'
if (project.hasProperty('fmpPhantomReview')) {
    if (!project.hasProperty('withPhantom')) throw new GradleException('Phantom review requires the locked official transport JAR')
    runProfile += '-phantom-review'
}
if (project.hasProperty('fmpPhantomPublished')) {
    if (!project.hasProperty('fmpPhantomReview') || project.hasProperty('fmpPackaged')) throw new GradleException('Published transport probe requires its isolated review profile')
    runProfile += '-released023'
}
if (project.hasProperty('fmpLegacyWorldReview')) runProfile += '-legacy023'
if (project.hasProperty('fmpPackaged')) {
    if (project.hasProperty('fmpGameTests') || project.hasProperty('fmpClientReview')) throw new GradleException('Packaged verification cannot load development test sources')
    runProfile += '-packaged'
}
if (project.hasProperty('fmpProbeMissing')) {
    def missing = project.property('fmpProbeMissing')
    if (!(missing in ['create', 'curios'])) throw new GradleException('Unknown required dependency probe')
    runProfile += "-missing-${missing}"
}

base {
    archivesName = 'create-feed-me-packages'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    test { java.srcDir('src/testFixtures/java') }
    gameTest {
        java.setSrcDirs(['src/gametest/java', 'src/testFixtures/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") {
        transitive = false
    }

    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"

    localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    localRuntime "dev.engine-room.vanillin:vanillin-neoforge-1.21.1:${vanillin_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    if (project.hasProperty('fmpPackaged')) {
        def artifact = layout.buildDirectory.file("libs/create-feed-me-packages-${project.version}.jar").get().asFile
        if (!artifact.isFile()) throw new GradleException('Build the main JAR before packaged verification')
        localRuntime files(artifact)
    }

    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    if (project.hasProperty('withJei')) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${project.findProperty('jei_runtime_version') ?: jei_version}"
    }
    if (project.hasProperty('withMobile')) {
        localRuntime files('../../../reference-build-safe/research/transports/1.21.1-0.7.7/create_mobile_packages-1.21.1-0.7.7.jar')
    }
    if (project.hasProperty('withCouriers')) {
        localRuntime files('../../../reference-build-safe/research/transports/2.3.0/cmpackagecouriers-neoforge-2.3.0.jar')
    }
    if (project.hasProperty('withPhantom')) {
        def phantom = new File(referenceOutput, 'phantom-compat/createphantom-1.0.2.jar')
        if (!phantom.isFile()) throw new GradleException('Missing locked Create Phantom 1.0.2 research input')
        localRuntime files(phantom)
    }
    if (project.hasProperty('fmpPhantomPublished')) {
        localRuntime files('../../../release/stable/v0.2.3/create-feed-me-packages-0.2.3.jar')
        localRuntime files(new File(referenceOutput, 'phantom-compat/fmp-phantom-test-probe.jar'))
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('fmpPhantomReview') ? 'fmp_phantom_compat' : (project.hasProperty('fmpLegacyWorldReview') ? 'fmp_legacy_migration' : project.mod_id + (project.hasProperty('withPhantom') ? ',fmp_phantom_compat' : ''))
            logLevel = org.slf4j.event.Level.INFO
            jvmArgument '-Xmx2G'
        }

        client {
            client()
            gameDirectory = file("${referenceOutput}/run/client/${runProfile}")
            if (project.hasProperty('fmpClientReview')) systemProperty 'fmp.clientReview', 'true'
            if (project.hasProperty('fmpConvergedReview')) systemProperty 'fmp.convergedReview', 'true'
            if (project.hasProperty('fmpT14Review')) systemProperty 'fmp.t14Review', 'true'
        }

        server {
            server()
            gameDirectory = file("${referenceOutput}/run/server/${runProfile}")
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file("${referenceOutput}/run/gametest/${runProfile}")
            systemProperty 'fmp.requirePriorPersistence', project.findProperty('fmpRequirePriorPersistence') ?: 'false'
            if (project.hasProperty('fmpLegacyWorldReview')) {
                systemProperty 'fmp.legacyBackup', new File(referenceOutput, 'legacy023-before').absolutePath
                systemProperty 'fmp.legacyJar', file('../../../release/stable/v0.2.3/create-feed-me-packages-0.2.3.jar').absolutePath
            }
        }
    }

    if (!project.hasProperty('fmpPackaged') && !project.hasProperty('fmpPhantomPublished')) {
        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
                if (project.hasProperty('fmpGameTests')) sourceSet sourceSets.gameTest
            }
        }
    }
}

// A test-only mod loads alongside the untouched release JAR. No FMP production classes are copied.
def phantomProbeMetadata = tasks.register('phantomProbeMetadata') {
    def metadata = layout.buildDirectory.file('generated/phantom-probe/META-INF/neoforge.mods.toml')
    outputs.file(metadata)
    doLast {
        def target = metadata.get().asFile
        target.parentFile.mkdirs()
        target.text = '''modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
[[mods]]
modId="fmp_phantom_probe"
version="1"
displayName="FMP isolated Phantom compatibility probe"
'''
    }
}
tasks.register('phantomProbeJar', Jar) {
    dependsOn tasks.named('gameTestClasses'), phantomProbeMetadata
    archiveFileName = 'fmp-phantom-test-probe.jar'
    destinationDirectory = new File(referenceOutput, 'phantom-compat')
    from(sourceSets.gameTest.output) {
        include 'dev/scathiard/feedmepackages/gametest/PhantomCompatibilityTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/ReceiveTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/SupplyTests*.class'
        include 'dev/scathiard/feedmepackages/gametest/TestPlayers*.class'
        include 'data/fmp_phantom_compat/structure/empty.nbt'
    }
    from(layout.buildDirectory.dir('generated/phantom-probe'))
}
if (project.hasProperty('fmpPhantomPublished')) {
    tasks.named('runGameTestServer').configure { dependsOn tasks.named('phantomProbeJar') }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processGameTestResources', ProcessResources).configure {
    from('src/gametest/resources/data/create_feed_me_packages/structure/empty.nbt') {
        into 'data/fmp_phantom_compat/structure'
    }
}

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

if (project.hasProperty('fmpPackaged') || project.hasProperty('fmpPhantomPublished')) {
    tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
        def sourceOutputs = sourceSets.main.output.files
        // Snapshot the input providers before replacing the collection, avoiding a self-referential filter.
        def originalRuntime = project.files(new ArrayList<>(classpathProvider.from))
        classpathProvider.setFrom(originalRuntime.filter { !sourceOutputs.contains(it) })
        setClasspath(project.files(classpath.files.findAll { !sourceOutputs.contains(it) }))
        doFirst {
            def paths = classpathProvider.files + classpath.files
            def expectedVersion = project.hasProperty('fmpPhantomPublished') ? '0.2.3' : project.version
            def artifacts = paths.findAll { it.name == "create-feed-me-packages-${expectedVersion}.jar" }
            if (paths.any { sourceOutputs.contains(it) } || artifacts.size() != 1) throw new GradleException('Packaged run contains development outputs or lacks its single main JAR')
            println "FMP_PACKAGED_SOURCE jar=${artifacts.first()} developmentOutputs=0"
        }
    }
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '8.12'
    distributionType = Wrapper.DistributionType.BIN
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property('mod_version', project.mod_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.mod_version)
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "create-feed-me-packages-${project.version}.jar"
    manifest.attributes([
            'Specification-Title'   : mod_name,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': mod_version
    ])
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
